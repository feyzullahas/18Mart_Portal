name: Refresh Bus Schedule PDFs

on:
  # Refresh all official schedule PDFs every six hours.
  schedule:
    - cron: '0 */6 * * *'
  
  # Allow manual trigger with options
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force commit even if files unchanged'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  TZ: 'Europe/Istanbul'

jobs:
  download-schedules:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: api/scripts/requirements.txt
      
      - name: Install dependencies
        run: pip install -r api/scripts/requirements.txt
      
      - name: Run download script
        id: download
        run: python api/scripts/refresh_bus_schedules.py
        continue-on-error: true
      
      - name: Check download status
        if: steps.download.outcome == 'failure'
        run: |
          echo "::error::Bus PDF refresh failed. The official schedule page or its PDF links may be unavailable."
          exit 1
      
      - name: Check for changes
        id: git-check
        run: |
          if [[ "${{ github.event.inputs.force_update }}" == "true" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            git diff --exit-code api/data/bus_schedules/ || echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add api/data/bus_schedules/
          COMMIT_DATE=$(TZ='Europe/Istanbul' date '+%Y-%m-%d %H:%M')
          git commit -m "chore: refresh bus schedule PDFs - $COMMIT_DATE" || echo "No changes to commit"
          git push
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bus-schedules-${{ github.run_number }}
          path: api/data/bus_schedules/
          retention-days: 7
          
      - name: Summary
        if: always()
        run: |
          echo "## 🚌 Bus Schedule Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Download Status | ${{ steps.download.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Files Changed | ${{ steps.git-check.outputs.changed || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f api/data/bus_schedules/metadata.txt ]; then
            echo "### Metadata" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat api/data/bus_schedules/metadata.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
